[package]
name = "hype-flow"
version = "0.1.0"
edition = "2024"
description = "Native offline dictation for niri"
default-run = "hype-flow"

[features]
default = ["desktop"]
desktop = ["dep:async-channel", "dep:gtk", "dep:gtk4-layer-shell", "dep:signal-hook"]

[[bin]]
name = "hype-flow"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "hype-flow-evaluate"
path = "src/bin/evaluate.rs"

[dependencies]
anyhow = "1"
async-channel = { version = "2", optional = true }
bzip2 = "0.5"
fancy-regex = "0.16"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"], optional = true }
gtk4-layer-shell = { version = "=0.8.1", optional = true }
hound = "3.5"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = { version = "0.3", optional = true }
tar = "0.4"
tempfile = "3"
text-processing-rs = "0.2"
toml = "0.9"
unicode-casefold = "0.2"
unicode-normalization = "0.1"

[workspace]
resolver = "3"
members = ["worker"]

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
