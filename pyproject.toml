[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hype-flow"
version = "0.1.0"
description = "Native offline dictation for niri"
requires-python = ">=3.11"

[project.scripts]
hype-flow = "dictation.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dictation = ["*.css", "*.svg", "native/*.c"]
